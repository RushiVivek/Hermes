# Render Blueprint — deploys hermes as a persistent Node web service.
#
# Why Render (not Vercel): hermes streams uploads *through* the server. Vercel's
# serverless functions cap request bodies at 4.5MB with no way to raise it.
# A persistent Node server has no such cap — the only limit is our
# next.config.ts `proxyClientMaxBodySize` (300mb).
#
# To use: in the Render dashboard, "New +" -> "Blueprint", point at this repo.
# Then set the secret env vars (marked sync:false below) in the dashboard;
# they are intentionally NOT stored in this file.
services:
  - type: web
    name: hermes
    runtime: node
    plan: free            # free tier spins down after ~15min idle (~30s cold start)
    region: singapore     # closest Render region to India; change if you prefer
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Secrets — set these in the Render dashboard, not in this file.
      - key: HERMES_PASSWORD_HASH   # from `npm run hash-password`
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: enables AI auto-organize on upload + smarter chat search.
      # Without it the app still works (manual filing + substring search).
      - key: GEMINI_API_KEY
        sync: false
